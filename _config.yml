# Site settings
title: Bishal
description: Essays and projects by Bishal.
author: Bishal
lang: en
timezone: Asia/Dhaka

# Contact: the only place the address is defined. Use {{ site.email }} elsewhere.
email: hi@bishal.co.uk

# Switch to https://bishal.co.uk (and add a CNAME file) once the domain is live.
url: "https://spideyonmoon.github.io"
baseurl: ""

github_username: spideyonmoon
twitter_username: spideyonmoon

# Used by jekyll-seo-tag
twitter:
  username: spideyonmoon
social:
  name: Bishal
  links:
    - https://github.com/spideyonmoon
    - https://x.com/spideyonmoon

markdown: kramdown
kramdown:
  input: GFM
  # A single newline in a post renders as a line break, as it does in most
  # Markdown editors. Set to false for strict Markdown paragraphs.
  hard_wrap: true
  math_engine: mathjax # emits \( \) and \[ \], rendered client-side by KaTeX
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    block:
      line_numbers: false

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Existing post URLs (/posts/<slug>/) are kept so old links still work.
permalink: /posts/:title/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
    values:
      layout: page

sass:
  style: compressed

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - tools
  - vendor
  - .devcontainer
  - .vscode
